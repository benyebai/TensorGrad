[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benyebai-tensorgrad"
version = "0.1.0"
description = "A small NumPy reverse-mode autodiff engine built from first principles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
py-modules = ["tensorgrad"]
